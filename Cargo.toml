[package]
name = "exr"
description = "Read and write OpenEXR files without any unsafe code"
keywords = ["exr", "openexr", "file", "binary", "io"]
categories = ["encoding", "filesystem", "graphics", "multimedia"]

version = "1.74.2"
edition = "2018"
authors = ["johannesvollmer <contact@johannesvollmer.com>"]

repository = "https://github.com/johannesvollmer/exrs"
readme = "README.md"
license = "BSD-3-Clause"
exclude = [ "specification/*", "specification/**", "tests/images/*", "tests/images/**" ]
rust-version = "1.83.0"

[badges]
maintenance = { status = "actively-developed" }

[lib]
path = "src/lib.rs"
test = true
doctest = true
bench = true
doc = true
plugin = false
proc-macro = false

[dependencies]
lebe = "^0.5.3"                # generic binary serialization
half = "2.7.1"                 # 16 bit float pixel data type
bit_field = "^0.10.3"          # exr file version bit flags
flate2 = { version = "^1.1.9", default-features = false, features = ["zlib-rs"] }  # zip compression for zip/pxr24/dwa; zlib-rs backend is pure rust, no C toolchain needed
smallvec = "^1.15.2"            # make cache-friendly allocations        TODO profile if smallvec is really an improvement!
rayon-core = { version = "^1.13.0", optional = true }         # threading for parallel compression
zune-inflate = { version = "^0.2.54", default-features = false, features = ["zlib"] }  # zip decompression, faster than miniz_oxide
pulp = "^0.22.3"                # used for runtime SIMD dispatch
num-complex = "0.4.6"          # pins pulps own dependency, pulp wants 0.4.4 but calls for Complex::ZERO/ONE/I; consts added in 0.4.6

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = { version = "11.6.0", default-features = false }  # detect L1d cache size to pick the Huffman decode LUT width

[dev-dependencies]
bencher = "0.1.5"
walkdir = "2.3.2"         # automatically test things for all files in a directory
rand = "0.10.2"            # used for fuzz testing
rayon = "1.12.0"           # run tests for many files in parallel

[features]
default = ["rayon"]

# rayon is used for parallel compression
rayon = ["dep:rayon-core"]

# Opt-in gates for the DWA SIMD tier unit tests
# Intentionally opt-in: each must be built and run under a CPU or emulator exposing
# the requested tier, e.g.
# `cargo test --lib --features avx2-tests -- avx2`
avx2-tests = []
sse2-tests = []

# Call the DWA DCT avx2/sse2/autovectorized kernels directly,
# bypassing runtime dispatch, for the comparison benchmark.
# Meaningless under emulation (timings won't reflect real hardware)
# `cargo bench --features simd-benches --bench dct`
simd-benches = []

# Override the AC-Huffman decode prefix-LUT size (huffman.rs' LUT_BITS).
# Bigger trades fewer long-code fallbacks for more L1d pressure per DWA
# chunk; without one of these pinned, x86/x86_64 picks it at runtime from
# the detected L1d size instead. Mutually exclusive.
huffman-lut-12 = []
huffman-lut-13 = []
huffman-lut-14 = []

[[example]]
name = "7_write_raw_blocks"
required-features = ["rayon"]

[[example]]
name = "8_read_raw_blocks"
required-features = ["rayon"]

[[bench]]
name = "read"
harness = false
required-features = ["rayon"]

[[bench]]
name = "profiling"
harness = false
required-features = ["rayon"]

[[bench]]
name = "write"
harness = false
required-features = ["rayon"]

[[bench]]
name = "pixel_format_conversion"
harness = false
required-features = ["rayon"]

[[bench]]
name = "dct"
harness = false
required-features = ["simd-benches"]

# recommended release settings for max runtime performance
[profile.release]
opt-level = 3
lto = true
debug = false
debug-assertions = false
codegen-units = 1

# test with fast runtime speed and slow build speed
[profile.dev]
incremental = true
opt-level = 3
debug-assertions = true
overflow-checks = true
debug = true
lto = true

# test with fast runtime speed and moderate build speed
[profile.test]
incremental = true
opt-level = 3
debug-assertions = true
overflow-checks = true
debug = true
lto = true

# bench with fastest runtime speed
[profile.bench]
opt-level = 3
debug-assertions = false
overflow-checks = false
lto = true
debug = true
codegen-units = 1
